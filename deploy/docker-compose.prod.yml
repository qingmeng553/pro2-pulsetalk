# ============================================================================
# PulseTalk 生产 Docker Compose(独立完整编排，勿与根目录 docker-compose.yml 叠加)
#
# 用法(在项目根目录)：
#   docker compose -f deploy/docker-compose.prod.yml \
#       --env-file deploy/.env.prod up -d --build
#
# 拓扑：唯一对外入口 = web(Nginx) 80 端口
#   - 前端静态页面(deploy/www = pro2-frontend/dist 构建产物)
#   - /api → pro2:8085    /files → minio:9000
#   mysql / redis / minio / pro2 全部不映射宿主机端口，仅容器内网互访
# ============================================================================
name: pulsetalk

services:
  # ---------------- MySQL 8 ----------------
  mysql:
    image: mysql:8.0
    container_name: pulsetalk-mysql
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root2297752516}
      MYSQL_DATABASE: community_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    volumes:
      - mysql-data:/var/lib/mysql
      # sql 目录在项目根目录(deploy/../sql)
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ---------------- Redis 7 ----------------
  redis:
    image: redis:7-alpine
    container_name: pulsetalk-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------------- MinIO(仅内网，图片经 web /files 反代) ----------------
  minio:
    image: minio/minio:latest
    container_name: pulsetalk-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------- 后端应用 ----------------
  pro2:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pulsetalk-server:1.0.0
    container_name: pulsetalk-server
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root2297752516}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8085/demo/ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------- Nginx 网关(唯一对外入口) ----------------
  web:
    image: nginx:1.27-alpine
    container_name: pulsetalk-web
    restart: always
    depends_on:
      pro2:
        condition: service_healthy
    ports:
      - "80:80"
      # HTTPS 启用后放开下行，并参考 nginx.prod.conf 文末注释挂载证书
      # - "443:443"
    volumes:
      # 前端构建产物(把 pro2-frontend/dist/* 复制到 deploy/www/)
      - ./www:/usr/share/nginx/html:ro
      # 网关配置
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书(可选)：- ./cert:/etc/nginx/cert:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

# ---------------- 命名数据卷 ----------------
volumes:
  mysql-data:
  redis-data:
  minio-data:
