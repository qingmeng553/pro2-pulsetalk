# ============================================================================
# PulseTalk 生产网关 Nginx 配置(供 docker-compose.prod.yml 中的 web 服务挂载)
# 只对外暴露 80(如需 HTTPS 见文末注释段)
#  - /api/*   → 反代后端 pro2:8085 并去掉 /api 前缀
#  - /files/* → 反代 MinIO minio:9000(图片走同一域名，浏览器无需直连 9000)
#  - 其余     → 前端静态资源(history 路由回退 index.html)
# ============================================================================
server {
    listen 80;
    server_name _;

    # 上传大小限制(与后端 multipart 上限保持一致)
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 后端 API 反代(/api 前缀被剥除) ----
    location /api/ {
        proxy_pass http://pro2:8085/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---- MinIO 图片反代(/files/community-upload/xxx → minio:9000/community-upload/xxx) ----
    location /files/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 前端静态 + history 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存(带 hash 的构建产物)
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

